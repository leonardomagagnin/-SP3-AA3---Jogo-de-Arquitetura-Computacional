<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Batalha - Architect Wars (Arquitetura Computacional)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topnav">
    <nav>
      <a href="index.html">Cruzadinha</a>
      <a href="batalha.html" class="active">Batalha</a>
    </nav>
  </header>

  <main class="container">
    <h1>Batalha — Enfrente o Bug-Bot</h1>
    <section id="battle-area">
      <div class="status-row">
        <div class="life player">
          <div class="label">Você</div>
          <progress id="player-life" max="100" value="100"></progress>
          <div id="player-life-val">100</div>
        </div>
        <div class="status-center">
          <div id="round-info">Rodada 0</div>
          <button id="restart-battle">Reiniciar</button>
        </div>
        <div class="life bot">
          <div class="label">Bug-Bot</div>
          <progress id="bot-life" max="100" value="100"></progress>
          <div id="bot-life-val">100</div>
        </div>
      </div>

      <div id="attack-area" class="attack-area">
        <!-- Texto do ataque do bot apareceria aqui -->
      </div>

      <div id="cards" class="cards">
        <!-- As 4 cartas do jogador serão renderizadas aqui -->
      </div>

      <div id="battle-feedback" class="feedback"></div>
    </section>
  </main>

  <script src="conceitos.js"></script>
  <script src="batalha.js"></script>
</body>
</html>
