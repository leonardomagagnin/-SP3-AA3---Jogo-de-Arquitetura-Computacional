<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cruzadinha - Arquitetura Computacional</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Cruzadinha: Arquitetura Computacional</h1>

    <section class="game">
      <div id="board-wrap">
        <div id="board"></div>
      </div>

      <aside class="clues">
        <div class="controls">
          <button id="check">Conferir</button>
          <button id="restart">Reiniciar</button>
          <div id="score">0 de 0 palavras</div>
        </div>

        <div class="lists">
          <div>
            <h2>Horizontais</h2>
            <ol id="across"></ol>
          </div>
          <div>
            <h2>Verticais</h2>
            <ol id="down"></ol>
          </div>
        </div>
        <div id="message" class="message"></div>
      </aside>
    </section>

    <footer>
      <p>Nível introdutório — disciplina Arquitetura Computacional</p>
    </footer>
  </main>

  <script src="dados.js"></script>
  <script src="script.js"></script>
</body>
</html>
